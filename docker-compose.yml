version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: techforum_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: stinkebilly
      POSTGRES_DB: techforum
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: